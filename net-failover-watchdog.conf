# /etc/net-failover-watchdog.conf
#
# Configuration file for net-failover-watchdog daemon.
#
# Changes to this file take effect upon service restart:
#   sudo systemctl restart net-failover-watchdog.service
#

# -----------------------------------------------------------------------------
# 1. TIMING & POLLING INTERVAL
# -----------------------------------------------------------------------------
# Polling interval between health checks and route evaluations (in seconds).
# Lower values detect drops faster but incur more frequent ICMP/HTTP traffic.
CHECK_INTERVAL=3

# -----------------------------------------------------------------------------
# 2. LAYER 3 ANYCAST HEALTH PROBING
# -----------------------------------------------------------------------------
# Destination Anycast recursive resolver IP addresses used for ICMP reachability.
# Spans multiple distinct Autonomous System Numbers (Cloudflare, Google, Quad9, Cisco OpenDNS).
L3_TARGETS=("1.1.1.1" "8.8.8.8" "9.9.9.9" "208.67.222.222")

# Minimum number of responding L3 targets required to consider the link viable.
L3_QUORUM=2

# Timeout for each parallel ICMP ping probe (in seconds).
L3_TIMEOUT=1

# -----------------------------------------------------------------------------
# 3. LAYER 7 CAPTIVE PORTAL & EGRESS VALIDATION
# -----------------------------------------------------------------------------
# Set to false to disable HTTP-based captive portal and application egress checks.
L7_CHECK_ENABLED=true

# Endpoints used for egress validation.
L7_URL_GOOGLE="http://connectivitycheck.gstatic.com/generate_204"
L7_URL_CLOUDFLARE="http://cp.cloudflare.com/generate_204"
L7_URL_MSFT="http://www.msftconnecttest.com/connecttest.txt"
L7_MSFT_EXPECTED="Microsoft Connect Test"

# Timeout for Layer 7 HTTP verification requests (in seconds).
L7_TIMEOUT=2

# -----------------------------------------------------------------------------
# 4. KERNEL FIB ROUTING METRICS
# -----------------------------------------------------------------------------
# Metric assigned to the active primary default route.
METRIC_PRIMARY=50

# Metric assigned to healthy standby default routes.
METRIC_BACKUP=200

# Metric assigned to degraded or unresponsive default routes.
# Ensures the route remains installed in the kernel FIB for local recovery
# without taking precedence over functioning uplinks.
METRIC_DEGRADED=500

# -----------------------------------------------------------------------------
# 5. ASYMMETRIC HYSTERESIS THRESHOLDS
# -----------------------------------------------------------------------------
# Number of consecutive failed cycles before demoting the active primary link.
# At CHECK_INTERVAL=3, 3 failures equates to ~9 seconds.
THRESHOLD_FAIL=3

# Number of consecutive successful cycles required before promoting a recovered
# link back to primary. Prevents route flapping on unstable / marginal connections.
# At CHECK_INTERVAL=3, 10 successes equates to ~30 seconds.
THRESHOLD_RECOVERY=10

# -----------------------------------------------------------------------------
# 6. HARDWARE INTERFACE PREFERENCE HIERARCHY
# -----------------------------------------------------------------------------
# Lower numeric weight indicates higher priority.
WEIGHT_LAN=1    # Motherboard / PCI / PCIe Ethernet
WEIGHT_USB=2    # USB Cellular Modems, Android USB Tethering, LTE Dongles
WEIGHT_WIFI=3   # 802.11 Wireless Interfaces
WEIGHT_OTHER=4  # Unclassified physical links

# Override weights for specific interfaces:
# INTERFACE_WEIGHTS["eth0"]=1
# INTERFACE_WEIGHTS["usb0"]=2
# INTERFACE_WEIGHTS["wlan0"]=3

# -----------------------------------------------------------------------------
# 7. INTERFACE DISCOVERY & FILTERING
# -----------------------------------------------------------------------------
# "auto" scans physical and wireless interfaces holding default routes or carrier.
# Alternatively, specify an explicit array of interfaces to manage:
# MANAGED_INTERFACES=("enp3s0" "usb0" "wlan0")
MANAGED_INTERFACES="auto"

# Interfaces ignored by auto-discovery. Shell glob syntax supported.
IGNORED_INTERFACES=(
    "lo"
    "docker*"
    "veth*"
    "virbr*"
    "tun*"
    "tap*"
    "wg*"
    "br-*"
    "podman*"
    "vmnet*"
    "vboxnet*"
)

# -----------------------------------------------------------------------------
# 8. SYSTEM DAEMON INTEGRATION
# -----------------------------------------------------------------------------
# Automatically update systemd-resolved per-link default routing domains
# and flush DNS caches via resolvectl on primary link transitions.
DNS_SYNC_ENABLED=true

# -----------------------------------------------------------------------------
# 9. KERNEL REVERSE PATH FILTERING (SYSCTL OPT-IN)
# -----------------------------------------------------------------------------
# By default (false), the watchdog does NOT alter kernel sysctl settings.
# Under strict rp_filter (rp_filter=1), probe replies on standby interfaces
# may be dropped by the kernel.
# Setting this to true will automatically configure loose mode (rp_filter=2)
# on managed interfaces only, without changing global host-wide sysctl defaults.
AUTO_CONFIG_RP_FILTER=false

# -----------------------------------------------------------------------------
# 10. RUNTIME PATHS & LOGGING
# -----------------------------------------------------------------------------
# Runtime state directory for hysteresis counters.
STATE_DIR="/run/net-failover-watchdog"

# Lock file to prevent concurrent daemon execution.
LOCK_FILE="/run/lock/net-failover-watchdog.lock"

# Log level: DEBUG, INFO, WARN, ERROR
LOG_LEVEL="INFO"
